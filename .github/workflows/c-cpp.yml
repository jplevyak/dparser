name: C/C++ CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: make
      run: make
    - name: make check
      run: make check

  rust:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: make
      run: make
    - name: cargo test
      working-directory: rust
      run: cargo test --workspace
    - name: C test suite on the Rust runtime
      working-directory: rust
      run: python3 conformance/run.py
